<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" role="img" aria-label="技术指标 指标是对原始数据的变换，不是独立证据"><defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#e9f5fa"/></linearGradient><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f4faff"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#397bb5"/></marker></defs><rect width="1280" height="660" fill="url(#sky)"/><circle cx="1175" cy="40" r="150" fill="#d9ecfb" opacity=".35"/><path d="M0 625 Q280 595 530 632 T1280 625" stroke="#c4e1ed" stroke-width="7" fill="none"/><text x="68" y="85" font-size="45" font-weight="750" fill="#143957" text-anchor="start">第五章 · 技术指标</text><text x="68" y="132" font-size="25" font-weight="430" fill="#62788f" text-anchor="start">指标是对原始数据的变换，不是独立证据</text><rect x="70" y="185" width="495" height="377" rx="19" fill="#fff" stroke="#d7e5f3" stroke-width="2"/><text x="92" y="233" font-size="27" font-weight="700" fill="#10385c" text-anchor="start">输入数据</text><text x="92" y="280" font-size="23" font-weight="500" fill="#4e667e" text-anchor="start">价格、成交量和时间</text><text x="92" y="321" font-size="23" font-weight="500" fill="#4e667e" text-anchor="start">相同输入可以生成多个指标</text><text x="92" y="362" font-size="23" font-weight="500" fill="#4e667e" text-anchor="start">指标之间可能高度相关</text><rect x="95" y="412" width="438" height="3" fill="#d0e4f1"/><polyline points="105,499 158,470 212,487 268,433 326,449 389,403 460,421 515,369" fill="none" stroke="#0a998b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="105,512 158,497 212,484 268,477 326,461 389,450 460,432 515,427" fill="none" stroke="#eba24c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="642" y="184" width="564" height="377" rx="19" fill="#fff" stroke="#d7e5f3" stroke-width="2"/><text x="664" y="232" font-size="27" font-weight="700" fill="#10385c" text-anchor="start">不同观察角度</text><text x="664" y="279" font-size="23" font-weight="500" fill="#4e667e" text-anchor="start">EMA：平滑价格，观察方向</text><text x="664" y="320" font-size="23" font-weight="500" fill="#4e667e" text-anchor="start">RSI：价格涨跌关系与相对动量</text><text x="664" y="361" font-size="23" font-weight="500" fill="#4e667e" text-anchor="start">ATR：典型波动幅度，不给方向</text><text x="664" y="402" font-size="23" font-weight="500" fill="#4e667e" text-anchor="start">VWAP：成交量加权均价</text><path d="M571 364H627" stroke="#397bb5" stroke-width="5" marker-end="url(#arrow)"/><text x="74" y="636" font-size="17" font-weight="450" fill="#8298ab" text-anchor="start">TECHNICAL ANALYSIS · EVIDENCE BEFORE CONCLUSION</text></svg>