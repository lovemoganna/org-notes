<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-label="把观察变成可验证交易系统">
<rect width="1440" height="860" fill="#071421"/>
<rect x="0" y="0" width="1440" height="7" fill="#52bcff"/>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:.1px}</style>
<text x="45" y="55" font-size="34" fill="#f4f8fb" font-weight="800" text-anchor="start" dominant-baseline="middle">场景 9：把观察变成可验证交易系统</text>
<text x="46" y="105" font-size="18" fill="#52bcff" font-weight="500" text-anchor="start" dominant-baseline="middle">交易假设／入场／失效／止损／仓位／R 倍数／期望值／回测／样本外／滑点</text>
<line x1="45" y1="134" x2="1394" y2="134" stroke="#385268" stroke-width="1.2" />
<rect x="972" y="156" width="423" height="631" rx="14" fill="#0c2132" stroke="#385268" stroke-width="1.4"/>
<text x="992" y="189" font-size="21" fill="#f4f8fb" font-weight="800" text-anchor="start" dominant-baseline="middle">术语速查 · 按证据解释</text>
<line x1="992" y1="212" x2="1372" y2="212" stroke="#385268" stroke-width="1" />
<rect x="990" y="222" width="91" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="237" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">交易假设</text>
<text x="995" y="266" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">可证伪的事先规则，不能事后改写。</text>
<rect x="990" y="289" width="108" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="304" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">入场／失效</text>
<text x="995" y="333" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">以当时可得信息确认触发与否。</text>
<rect x="990" y="356" width="72" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="371" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">止损</text>
<text x="995" y="400" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">尝试限制风险，非成交价格保证。</text>
<rect x="990" y="423" width="72" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="438" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">仓位</text>
<text x="995" y="467" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">以风险预算÷每单位止损距离计算。</text>
<rect x="990" y="490" width="77" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="505" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">R 倍数</text>
<text x="995" y="534" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">盈亏÷计划单笔风险，注意尾部风险。</text>
<rect x="990" y="557" width="91" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="572" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">期望收益</text>
<text x="995" y="601" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">胜率×平均盈利 − 败率×平均亏损。</text>
<rect x="990" y="624" width="125" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="639" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">回测与样本外</text>
<text x="995" y="668" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">冻结规则后，扣费并独立检验。</text>
<rect x="990" y="691" width="91" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="706" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">前视偏差</text>
<text x="995" y="735" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">禁止使用成交当时尚未知的信息。</text>
<rect x="44" y="801" width="1352" height="44" rx="7" fill="#10293e" stroke="#385268" stroke-width="1.4"/>
<text x="62" y="824" font-size="15.2" fill="#adc4d4" font-weight="500" text-anchor="start" dominant-baseline="middle">合成教学数据｜假设、策略结果和成交价均不保证；本图不是交易建议</text>
<rect x="44" y="155" width="900" height="624" rx="13" fill="#0c2132" stroke="#385268" stroke-width="1.4"/>
<text x="61" y="180" font-size="17" fill="#adc4d4" font-weight="650" text-anchor="start" dominant-baseline="middle">案例：多头入场 105，止损 101，单位风险 4；假设仅用于教学</text>
