<text x="45" y="55" font-size="34" fill="#f4f8fb" font-weight="800" text-anchor="start" dominant-baseline="middle">场景 1：看懂 K 线与价格反应</text>
<text x="46" y="105" font-size="18" fill="#52bcff" font-weight="500" text-anchor="start" dominant-baseline="middle">实体／影线／OHLCV／针形线／吞没／内包线／成交量／主动成交</text>
<line x1="45" y1="134" x2="1394" y2="134" stroke="#385268" stroke-width="1.2" />
<rect x="972" y="156" width="423" height="631" rx="14" fill="#0c2132" stroke="#385268" stroke-width="1.4"/>
<text x="992" y="189" font-size="21" fill="#f4f8fb" font-weight="800" text-anchor="start" dominant-baseline="middle">术语速查 · 按证据解释</text>
<line x1="992" y1="212" x2="1372" y2="212" stroke="#385268" stroke-width="1" />
<rect x="990" y="222" width="73" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="237" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">OHLCV</text>
<text x="995" y="266" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">开盘、最高、最低、收盘和成交量。</text>
<rect x="990" y="289" width="91" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="304" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">长上影线</text>
<text x="995" y="333" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">盘中上探但收盘未维持在高位。</text>
<rect x="990" y="356" width="74" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="371" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">针形线</text>
<text x="995" y="400" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">长单侧影线及相对较小的实体。</text>
<rect x="990" y="423" width="72" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="438" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">吞没</text>
<text x="995" y="467" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">后一实体覆盖前一实体；非反转结论。</text>
<rect x="990" y="490" width="74" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="505" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">内包线</text>
<text x="995" y="534" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">后一根最高和最低均位于前一根内。</text>
<rect x="990" y="557" width="74" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="572" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">成交量</text>
<text x="995" y="601" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">同一市场及周期内的成交总量。</text>
<rect x="990" y="624" width="91" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="639" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">主动买量</text>
<text x="995" y="668" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">主动成交方向，不识别具体账户。</text>
<rect x="990" y="691" width="91" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="706" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">价格行为</text>
<text x="995" y="735" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">结合位置、走势与量价提出假设。</text>
<rect x="44" y="801" width="1352" height="44" rx="7" fill="#10293e" stroke="#385268" stroke-width="1.4"/>
<text x="62" y="824" font-size="15.2" fill="#adc4d4" font-weight="500" text-anchor="start" dominant-baseline="middle">合成教学数据｜只标识现象或候选结构，不推断账户身份和市场意图</text>
