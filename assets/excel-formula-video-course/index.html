<style>

.formula-label{color:var(--mint);overflow-wrap:anywhere;font-weight:650;font-size:.9em}
.lesson-topic{grid-column:2;font-size:.88em;color:var(--muted);margin-top:2px}
.search-label{display:block;margin:8px 6px 4px;color:var(--muted);font-size:.9em}
.search{width:100%;padding:8px;color:var(--ink);background:#132430;border:1px solid var(--line);border-radius:7px;font:inherit}
.search:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
[hidden]{display:none!important}
.empty-search{margin:8px 6px;font-size:.88em;color:var(--muted)}
.formula-note{margin-top:10px;border-top:1px solid var(--line);padding:9px 0 2px}
.formula-note summary{line-height:1.45}
.formula-code{overflow-x:auto;white-space:normal;font:600 15px/1.55 Consolas,monospace;padding:12px;background:#101e28;border-radius:6px}
.formula-code span{white-space:pre}
.formula-code .function{color:#80e2bf}.formula-code .reference{color:#9ccbff}
.formula-code .literal{color:#ddaaf0}.formula-code .operator{color:#ffc68e}

.formula-note dt{color:var(--mint);overflow-wrap:anywhere}.formula-note dd{margin:0}

.label{color:var(--mint);font-weight:650;margin:0 0 7px}.heading{font-size:clamp(22px,3vw,34px);line-height:1.2;margin:0 0 12px}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:14px 0}

button{cursor:pointer}button:hover,.actions a:hover{border-color:var(--mint)}

.exercise{padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:12px}
.exercise h3,.exercise summary{color:var(--amber)}.exercise h3{font-size:18px}
.exercise p{margin:7px 0}summary{cursor:pointer}
.notes label{display:block;font-weight:640;margin:15px 0 6px}
textarea{width:100%;min-height:88px;resize:vertical;color:var(--ink);background:#132430;border:1px solid var(--line);padding:10px;border-radius:7px;font:inherit}
.note-state{font-size:14px;color:var(--muted)}
@media(max-width:720px){header{padding:18px 14px 10px}.shell{grid-template-columns:1fr;padding:4px 14px 22px}nav{order:2}}

<script>
"use strict";
const course=JSON.parse(document.querySelector("#course-data").textContent);
const el=id=>document.getElementById(id);
const assetRoot=document.documentElement.dataset.courseAssets||"";
el("practice-book").href=assetRoot+"公式跟练.xlsx";
el("answers-book").href=assetRoot+"公式参考答案.xlsx";
let current=course.lessons[0], subtitles=false;
let movie=el("movie");
const lessonLinks=new Map();
const directory=el("directory");
const text=(tag,value)=>Object.assign(document.createElement(tag),{textContent:value});
const chapterGroups=[];
const functionNames=new Set(course.lessons.flatMap(lesson=>lesson.formulaNames));
course.chapters.forEach((name,index)=>{
 const group=document.createElement("section");
 const links=[];
 group.append(text("h3",name));
 course.lessons.filter(x=>x.chapter===index+1).forEach(lesson=>{
   const a=document.createElement("a");
   a.href="#"+lesson.id;
   a.setAttribute("aria-label",lesson.id+" "+lesson.title);
   const formula=text("span",lesson.formulaLabel); formula.className="formula-label";
   const topic=text("span",lesson.topic); topic.className="lesson-topic";
   a.append(text("b",lesson.id),formula,topic);
   group.append(a); lessonLinks.set(lesson.id,a);
   links.push({a,key:(lesson.id+" "+lesson.title).toUpperCase(),functions:new Set(lesson.formulaNames)});
 });
 directory.append(group);
 chapterGroups.push({group,links});
});
function filterLessons(){
 const terms=el("formula-search").value.trim().toUpperCase().split(/\s+/).filter(Boolean);
 let shown=0;
 for(const {group,links} of chapterGroups){
   let matches=0;
   for(const {a,key,functions} of links){
     a.hidden=!terms.every(term=>functionNames.has(term)?functions.has(term):key.includes(term));
     if(!a.hidden) matches++;
   }
   group.hidden=!matches;
   shown+=matches;
 }
 el("empty-search").hidden=shown>0;
}
el("formula-search").addEventListener("input",filterLessons);
const keys=Object.create(null);
let storage=true;
try{localStorage.setItem("excel-formula-availability","1");localStorage.removeItem("excel-formula-availability");}catch{storage=false;}
const storageKey=id=>"excel-formula-course-note-"+id;
function note(){
 try{return localStorage.getItem(storageKey(current.id))||keys[current.id]||"";}catch{return keys[current.id]||"";}
}
function save(){
 const value=el("notes").value; keys[current.id]=value;
 try{localStorage.setItem(storageKey(current.id),value);}catch{storage=false;}
 el("note-state").textContent=storage?"笔记保存在当前浏览器。":"当前浏览器限制本地保存，请使用下载。";
}
let track;
function toggle(){
 subtitles=!subtitles;
 if(track) track.mode=subtitles?"showing":"hidden";
 el("caption").textContent=subtitles?"隐藏字幕":"显示字幕";
 el("caption").setAttribute("aria-pressed",String(subtitles));
}
function jumpTo(time){
 const target=movie;
 const seek=()=>{if(target===movie) target.currentTime=time;};
 if(!target.readyState) target.addEventListener("loadedmetadata",seek,{once:true});
 else seek();
 target.play().catch(()=>{});
}
function showFormulaNotes(){
 const list=el("formula-notes");
 list.replaceChildren();
 for(const page of current.breakdowns){
   const card=document.createElement("details");
   card.className="formula-note";
   card.name="lesson-formula";
   card.append(text("summary",page.cell+" · "+page.purpose));
   const code=document.createElement("pre");
   code.className="formula-code";
   code.setAttribute("aria-label","Excel 公式");
   const syntax=document.createElement("code");
   for(const [fragment,kind] of page.syntax){
     const token=text("span",fragment); token.className=kind;syntax.append(token);
     if(fragment===","||fragment==="*") syntax.append(document.createElement("wbr"));
   }
   code.append(syntax);card.append(code);
   const parameters=document.createElement("dl");
   for(const pair of page.parameters){
     parameters.append(text("dt",pair.token),text("dd",pair.meaning));
   }
   card.append(parameters,text("p",page.scenario));
   const play=text("button","播放 "+page.cell+" 的讲解");
   play.type="button";
   play.addEventListener("click",()=>{jumpTo(page.start);movie.scrollIntoView({block:"nearest"});});
   card.append(play); list.append(card);
 }
}
function show(){
 if(el("notes").dataset.id) save();
 const id=location.hash.slice(1);
 current=course.lessons.find(x=>x.id===id)||course.lessons[0];
 lessonLinks.forEach((a,n)=>{
   if(n===current.id)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");
 });
 const base=assetRoot+"lessons/"+current.id+"/";
 el("chapter").textContent="第 "+current.chapter+" 章 · 第 "+current.id+" 节";
 el("title").textContent=current.title;
 document.title=current.id+" · "+current.title+" · Excel 公式课";
 const next=document.createElement("video");
 next.id="movie";next.controls=true;next.playsInline=true;next.preload="metadata";
 next.setAttribute("aria-labelledby","title");next.poster=base+"cover.jpg";next.src=base+"lesson.mp4";
 movie.replaceWith(next);movie=next;
 track=movie.addTextTrack("captions","课程字幕","zh-CN");
 current.cues.forEach(([a,b,c])=>track.addCue(new VTTCue(a,b,c)));
 track.mode=subtitles?"showing":"hidden";
 el("download").href=base+"lesson.mp4";
 el("download").download=current.id+" "+current.title.replaceAll(" / ","、").replace(/[<>:"/\\|?*]/g,"-")+".mp4";
 el("srt").href=base+"subtitles.srt";el("srt").download="";
 el("transcript").href=base+"transcript.md";
 showFormulaNotes();
 const formula=new URLSearchParams(location.search).get("formula");
 const position=current.breakdowns.findIndex(page=>page.cell===formula);
 if(position>=0){
   el("formula-notes").children[position].open=true;
   const chosen=movie, start=current.breakdowns[position].start;
   chosen.addEventListener("loadedmetadata",()=>{if(chosen===movie) chosen.currentTime=start;},{once:true});
 }
 el("quiz").textContent=current.quiz; el("answer").textContent=current.answer; el("solution").open=false;
 el("notes").value=note();el("notes").dataset.id=current.id;
 el("note-state").textContent=storage?"笔记保存在当前浏览器。":"当前浏览器限制本地保存，请使用下载。";
}
el("caption").addEventListener("click",toggle);
el("recalc").addEventListener("click",()=>jumpTo(current.recap));
el("notes").addEventListener("input",save);
el("note-download").addEventListener("click",()=>{
 const blob=new Blob([current.title+"\n\n"+el("notes").value],{type:"text/plain;charset=UTF-8"});
 const url=URL.createObjectURL(blob), link=document.createElement("a");
 link.href=url;link.download="Excel-"+current.id+"-学习笔记.txt";link.click();
 setTimeout(()=>URL.revokeObjectURL(url),2000);
});
window.addEventListener("hashchange",show);show();
</script>
</body>
</html>
