<script>
const catalog=JSON.parse(document.getElementById('catalog').textContent),video=document.getElementById('video'),list=document.getElementById('chapters');
const links=document.getElementById('links'),markers=document.getElementById('markers'),prev=document.getElementById('prev'),next=document.getElementById('next');
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const note=document.getElementById('chapter-note'),noteLabel=document.getElementById('note-label'),noteStatus=document.getElementById('note-status');
const notesInMemory=new Map();
const noteKey=chapter=>'org-notes:duckdb-sql-video-course:note:v1:'+chapter;
let current;
function loadNote(chapter){
  noteLabel.textContent='第 '+chapter+' 章学习笔记';
  try{
    note.value=notesInMemory.has(chapter)?notesInMemory.get(chapter):localStorage.getItem(noteKey(chapter))??'';
    noteStatus.textContent=notesInMemory.has(chapter)?'未保存到浏览器':'自动保存在当前浏览器';
  }catch{
    note.value=notesInMemory.get(chapter)??'';
    noteStatus.textContent='浏览器存储不可用，刷新前请复制笔记';
  }
}
note.addEventListener('input',()=>{
  const chapter=current.chapter;
  try{
    if(note.value==='')localStorage.removeItem(noteKey(chapter));
    else localStorage.setItem(noteKey(chapter),note.value);
    notesInMemory.delete(chapter);
    noteStatus.textContent='已保存到当前浏览器';
  }catch{
    notesInMemory.set(chapter,note.value);
    noteStatus.textContent='未保存到浏览器，刷新前请复制笔记';
  }
});
function open(n){
  current=catalog.find(x=>x.chapter===n)||catalog[catalog.length-1];
  list.value=current.chapter;prev.disabled=current.chapter===1;next.disabled=current.chapter===catalog.length;
  document.getElementById('title').textContent='第 '+current.chapter+' 章 · '+current.title;
  video.poster=current.cover;video.src=current.video;
  loadNote(current.chapter);
  links.replaceChildren();markers.replaceChildren();
  for(const [key,name] of [['video','下载 MP4'],['notes','讲稿'],['sql','原例与实测'],['answer','练习答案']]){
    if(!current[key])continue;
    const link=document.createElement('a');link.href=current[key];link.textContent=name;if(key==='video')link.download='';
    links.append(link);
  }
  for(const item of current.scenes){
    const btn=document.createElement('button');btn.type='button';btn.dataset.time=item.seconds;btn.textContent=fmt(item.seconds)+'　'+item.title;
    btn.onclick=()=>{video.currentTime=item.seconds;video.play().catch(()=>{});};markers.append(btn);
  }
  try{history.replaceState(null,'','#chapter-'+current.chapter);}catch{}
}
video.addEventListener('timeupdate',()=>{
  const buttons=[...markers.children];const active=buttons.findLast(button=>Number(button.dataset.time)<=video.currentTime);
  for(const el of buttons)el.setAttribute('aria-current',el===active?'true':'false');
});
list.onchange=()=>open(Number(list.value));prev.onclick=()=>open(current.chapter-1);next.onclick=()=>open(current.chapter+1);
open(Number(location.hash.replace('#chapter-',''))||1);
</script></html>
