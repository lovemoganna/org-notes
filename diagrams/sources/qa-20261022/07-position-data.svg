<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-label="区分现货、链上及合约证据">
<rect width="1440" height="860" fill="#071421"/>
<rect x="0" y="0" width="1440" height="7" fill="#52bcff"/>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:.1px}</style>
<text x="45" y="55" font-size="34" fill="#f4f8fb" font-weight="800" text-anchor="start" dominant-baseline="middle">场景 7：区分现货、链上及合约证据</text>
<text x="46" y="105" font-size="18" fill="#52bcff" font-weight="500" text-anchor="start" dominant-baseline="middle">现货／地址余额／交易所净流出／积累趋势评分／未平仓量／多空比／资金费率</text>
<line x1="45" y1="134" x2="1394" y2="134" stroke="#385268" stroke-width="1.2" />
<rect x="972" y="156" width="423" height="631" rx="14" fill="#0c2132" stroke="#385268" stroke-width="1.4"/>
<text x="992" y="189" font-size="21" fill="#f4f8fb" font-weight="800" text-anchor="start" dominant-baseline="middle">术语速查 · 按证据解释</text>
<line x1="992" y1="212" x2="1372" y2="212" stroke="#385268" stroke-width="1" />
<rect x="990" y="222" width="91" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="237" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">现货成交</text>
<text x="995" y="266" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">发生了真实交易，通常不披露账户身份。</text>
<rect x="990" y="289" width="91" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="304" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">地址余额</text>
<text x="995" y="333" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">链上地址持币，不自动等于实体。</text>
<rect x="990" y="356" width="125" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="371" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">交易所净流出</text>
<text x="995" y="400" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">口径为提现减充值，不等于净买入。</text>
<rect x="990" y="423" width="125" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="438" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">积累趋势评分</text>
<text x="995" y="467" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">实体余额大小与近月余额变化加权。</text>
<rect x="990" y="490" width="121" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="505" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">未平仓量 OI</text>
<text x="995" y="534" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">合约存量；与现货增仓不是一回事。</text>
<rect x="990" y="557" width="74" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="572" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">多空比</text>
<text x="995" y="601" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">账户数或仓位比，需注明平台口径。</text>
<rect x="990" y="624" width="91" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="639" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">资金费率</text>
<text x="995" y="668" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">永续合约结算机制下的持有成本。</text>
<rect x="44" y="801" width="1352" height="44" rx="7" fill="#10293e" stroke="#385268" stroke-width="1.4"/>
<text x="62" y="824" font-size="15.2" fill="#adc4d4" font-weight="500" text-anchor="start" dominant-baseline="middle">合成教学数据｜只标识现象或候选结构，不推断账户身份和市场意图</text>
<rect x="44" y="155" width="900" height="624" rx="13" fill="#0c2132" stroke="#385268" stroke-width="1.4"/>
<text x="61" y="180" font-size="17" fill="#adc4d4" font-weight="650" text-anchor="start" dominant-baseline="middle">不能跨数据层推导同一账户的买卖或操盘意图</text>
<line x1="87" y1="224" x2="897" y2="224" stroke="#224056" stroke-width="1" />
<text x="905" y="225" font-size="11" fill="#adc4d4" font-weight="500" text-anchor="start" dominant-baseline="middle">119.0</text>
