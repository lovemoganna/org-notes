<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-label="用成交分布与订单流解释价格">
<rect width="1440" height="860" fill="#071421"/>
<rect x="0" y="0" width="1440" height="7" fill="#52bcff"/>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;letter-spacing:.1px}</style>
<text x="45" y="55" font-size="34" fill="#f4f8fb" font-weight="800" text-anchor="start" dominant-baseline="middle">场景 5：用成交分布与订单流解释价格</text>
<text x="46" y="105" font-size="18" fill="#52bcff" font-weight="500" text-anchor="start" dominant-baseline="middle">成交量分布／TPO／POC／价值区域／逐价成交／Delta／订单簿／买卖价差／吸收</text>
<line x1="45" y1="134" x2="1394" y2="134" stroke="#385268" stroke-width="1.2" />
<rect x="972" y="156" width="423" height="631" rx="14" fill="#0c2132" stroke="#385268" stroke-width="1.4"/>
<text x="992" y="189" font-size="21" fill="#f4f8fb" font-weight="800" text-anchor="start" dominant-baseline="middle">术语速查 · 按证据解释</text>
<line x1="992" y1="212" x2="1372" y2="212" stroke="#385268" stroke-width="1" />
<rect x="990" y="222" width="108" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="237" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">成交量分布</text>
<text x="995" y="266" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">某个窗口内按价格档聚合实际成交量。</text>
<rect x="990" y="289" width="72" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="304" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">TPO</text>
<text x="995" y="333" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">按时间片统计价格访问，不等于成交量。</text>
<rect x="990" y="356" width="72" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="371" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">POC</text>
<text x="995" y="400" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">所选轮廓的活动峰值价格档。</text>
<rect x="990" y="423" width="91" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="438" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">价值区域</text>
<text x="995" y="467" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">按指定比例与算法选取活动范围。</text>
<rect x="990" y="490" width="91" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="505" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">逐价成交</text>
<text x="995" y="534" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">按价位及主动方拆分成交。</text>
<rect x="990" y="557" width="73" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="572" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">Delta</text>
<text x="995" y="601" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">主动买量减主动卖量。</text>
<rect x="990" y="624" width="74" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="639" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">订单簿</text>
<text x="995" y="668" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">尚未成交的可见买卖挂单。</text>
<rect x="990" y="691" width="72" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="706" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">吸收</text>
<text x="995" y="735" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">大成交下价格推进有限：仅候选现象。</text>
<rect x="44" y="801" width="1352" height="44" rx="7" fill="#10293e" stroke="#385268" stroke-width="1.4"/>
<text x="62" y="824" font-size="15.2" fill="#adc4d4" font-weight="500" text-anchor="start" dominant-baseline="middle">合成教学数据｜只标识现象或候选结构，不推断账户身份和市场意图</text>
<rect x="44" y="155" width="900" height="624" rx="13" fill="#0c2132" stroke="#385268" stroke-width="1.4"/>
<text x="61" y="180" font-size="17" fill="#adc4d4" font-weight="650" text-anchor="start" dominant-baseline="middle">不同数据源使用不同面板，不能从单根 K 线推导交易者身份</text>
<rect x="61" y="204" width="482" height="283" rx="9" fill="#10293e" stroke="#385268" stroke-width="1.4"/>
