<text x="995" y="467" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">从低点起算：80 + 1.618×40 =</text>
<text x="995" y="487" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle"> 144.72。</text>
<rect x="990" y="490" width="91" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="505" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">谐波形态</text>
<text x="995" y="534" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">用固定波段比率约束的几何候选。</text>
<rect x="990" y="557" width="91" height="29" rx="6" fill="#071421" stroke="#52bcff" stroke-width="1.4"/>
<text x="999" y="572" font-size="15.2" fill="#52bcff" font-weight="700" text-anchor="start" dominant-baseline="middle">江恩工具</text>
<text x="995" y="601" font-size="15" fill="#adc4d4" font-weight="400" text-anchor="start" dominant-baseline="middle">依赖价格／时间刻度的几何假设。</text>
