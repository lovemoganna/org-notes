<text x="92" y="632" font-size="15" fill="#ffd064" font-weight="500" text-anchor="start" dominant-baseline="middle">注意延伸的锚定方式有多种；所有数字必须按同一公式计算。</text>
<text x="92" y="772" font-size="15" fill="#ffd064" font-weight="500" text-anchor="start" dominant-baseline="middle">谐波 / 江恩 / 周期只生成候选区域；没有统计验证不能声称具有预测优势。</text>
