name: Publish Org knowledge

on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - 'note-assets/**'
      - 'pages/**'
      - 'resources/**'
      - 'assets/**'
      - '*.html'
      - 'assets.json'
      - 'ai-public.json'
      - 'museum.json'
      - 'tools/check_wiki_integrity.py'
      - 'tools/test_wiki_integrity.py'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-museum-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout fixed publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: lovemoganna/org-museum.el
          ref: cd6a10a5387850a385e6872f4983665d4ab27706
          path: _publisher
          persist-credentials: false
      - name: Regression test user-authorized article cleanup
        run: python3 _publisher/tools/test_museum_update_user_scope.py
      - name: Regression test real article cleanup
        run: python3 tools/test_museum_user_scope_regression.py
      - name: Regression test MP3 and existing source contracts
        run: python3 -m unittest discover -s _publisher/test -p test_museum_pipeline.py -k Validation -v
      - name: Regression test media URLs and safety
        run: node _publisher/test/org-museum-media-test.js
      - name: Install batch Emacs
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: '30.2'
      - name: Regression test native Org table cell breaks
        run: emacs -Q --batch -L _publisher -l _publisher/test/org-museum-table-test.el -f ert-run-tests-batch-and-exit
      - name: Verify source contract and publisher pin
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          config = json.loads(Path('museum.json').read_text())
          actual = subprocess.check_output(['git', '-C', '_publisher', 'rev-parse', 'HEAD'], text=True).strip()
          assert config['publishMode'] == 'actions'
          assert config['publisher']['commit'] == actual
          PY
          python3 _publisher/tools/museum_pipeline.py validate --root .
      - name: Run Wiki disposable Git and negative regressions
        run: python3 tools/test_wiki_integrity.py
      - name: Verify Wiki source integrity
        run: python3 tools/check_wiki_integrity.py .
      - name: Protect identities of declared URL updates
        env:
          UPDATE_BASE: ${{ github.event.before }}
          UPDATE_COMMIT: ${{ github.sha }}
        run: |
          if git log -1 --format=%s | grep -q '^Museum-Update: '; then
            if [ -z "$UPDATE_BASE" ]; then UPDATE_BASE=$(git rev-parse "$UPDATE_COMMIT^"); fi
            python3 _publisher/tools/museum_update.py check-commit --root . --base "$UPDATE_BASE" --commit "$UPDATE_COMMIT"
          fi
      - name: Build without running note code
        env:
          LANG: C.UTF-8
        run: python3 _publisher/tools/museum_pipeline.py build --root . --engine _publisher --output _site
      - name: Verify built Bu Xihuan MP3 and native player
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = "63f92e6eb9517b4b2783672f2b0e496374015a4951e2362fb646a16dd9dbdeb2"
          page = Path("_site/pages/collected/ideas/suno-songwriting/b861d8ab-bcee-4e85-a44d-dc44ef826120.html")
          assert page.is_file(), "song page missing"
          html = page.read_text(encoding="utf-8")
          assert "<audio" in html.lower(), "native audio player missing"
          files = [p for p in Path("_site").rglob("*.mp3") if hashlib.sha256(p.read_bytes()).hexdigest() == expected]
          assert files, "published MP3 does not match uploaded audio"
          print("VERIFIED_BUILT_MP3", files[0], files[0].stat().st_size, expected)
          PY
      - name: Record source and build provenance
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('_site/museum-release.json')
          result = json.loads(path.read_text())
          assert result['sourceCommit'] == os.environ['SOURCE_COMMIT']
          result['buildUrl'] = os.environ['BUILD_URL']
          path.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload validated site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Checkout fixed verification entry
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: lovemoganna/org-museum.el
          ref: cd6a10a5387850a385e6872f4983665d4ab27706
          path: _publisher
          persist-credentials: false
      - name: Verify live published content
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 _publisher/tools/museum_pipeline.py verify --commit "$SOURCE_COMMIT"
      - name: Checkout source for page binding verification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: _source
          persist-credentials: false
      - name: Verify public Bu Xihuan MP3 bytes and player
        run: |
          python3 - <<'PY'
          import hashlib, json, time, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          expected = "63f92e6eb9517b4b2783672f2b0e496374015a4951e2362fb646a16dd9dbdeb2"
          file = Path("_source/notes/ideas/suno-songwriting/b861d8ab-bcee-4e85-a44d-dc44ef826120.org")
          if not file.is_file() or "buxihuan.mp3" not in file.read_text(encoding="utf-8"):
              print("Audio note is absent; no archived song to verify")
              raise SystemExit(0)
          page_url = "https://lovemoganna.github.io/org-notes/pages/collected/ideas/suno-songwriting/b861d8ab-bcee-4e85-a44d-dc44ef826120.html"
          class AudioSources(HTMLParser):
              def __init__(self): super().__init__(); self.inside = False; self.urls = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "audio":
                      self.inside = True
                      if a.get("src"): self.urls.append(a["src"])
                  if tag == "source" and self.inside and a.get("src"): self.urls.append(a["src"])
              def handle_endtag(self, tag):
                  if tag == "audio": self.inside = False
          last = None
          for attempt in range(4):
              try:
                  req = urllib.request.Request(page_url, headers={"User-Agent": "Org-Museum-Audio-Verification/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as result:
                      html = result.read().decode("utf-8", errors="replace")
                  parser = AudioSources(); parser.feed(html)
                  urls = [urllib.parse.urljoin(page_url, s) for s in parser.urls]
                  urls = [u for u in urls if urllib.parse.urlsplit(u).hostname == "lovemoganna.github.io" and urllib.parse.urlsplit(u).path.lower().endswith(".mp3")]
                  assert urls, "no native site-hosted MP3 source found in article"
                  audio_url = urls[0]
                  with urllib.request.urlopen(urllib.request.Request(audio_url, headers={"User-Agent": "Org-Museum-Audio-Verification/1.0"}), timeout=30) as result:
                      data = result.read()
                  digest = hashlib.sha256(data).hexdigest()
                  assert digest == expected, f"published audio SHA256 mismatch: {digest}"
                  print("MUSEUM-AUDIO-PUBLISHED-RECEIPT " + json.dumps({"url": audio_url, "bytes": len(data), "sha256": digest}))
                  break
              except Exception as error:
                  last = str(error)
                  if attempt < 3: time.sleep(6)
          else: raise RuntimeError("live audio verification failed: " + str(last))
          PY
      - name: Record verified URL source bindings for Chat
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '_publisher/tools')
          import museum_update, museum_pipeline
          root = Path('_source').resolve()
          config = json.loads((root / 'museum.json').read_text())
          for note in museum_pipeline.validate(root):
              if note['status'] == 'published':
                  url = config['siteUrl'].rstrip('/') + '/' + note['href']
                  print('MUSEUM-URL-RESOLVED ' + json.dumps(museum_update.resolve(root, url), ensure_ascii=False))
          PY
