name: Publish Org knowledge

on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - 'note-assets/**'
      - 'pages/**'
      - 'resources/**'
      - 'assets/**'
      - '*.html'
      - 'assets.json'
      - 'ai-public.json'
      - 'museum.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-museum-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout fixed publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: lovemoganna/org-museum.el
          ref: 5c54566428bac03d4ea50796b179499247168e8d
          path: _publisher
          persist-credentials: false
      - name: Install batch Emacs
        uses: purcell/setup-emacs@34c6ded44899fd1bf74d2889558befd1750e61a7
        with:
          version: '30.2'
      - name: Verify source contract and publisher pin
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          config = json.loads(Path('museum.json').read_text())
          actual = subprocess.check_output(['git', '-C', '_publisher', 'rev-parse', 'HEAD'], text=True).strip()
          assert config['publishMode'] == 'actions'
          assert config['publisher']['commit'] == actual
          PY
          python3 _publisher/tools/museum_pipeline.py validate --root .
      - name: Build without running note code
        env:
          LANG: C.UTF-8
        run: python3 _publisher/tools/museum_pipeline.py build --root . --engine _publisher --output _site
      - name: Record source and build provenance
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('_site/museum-release.json')
          result = json.loads(path.read_text())
          assert result['sourceCommit'] == os.environ['SOURCE_COMMIT']
          result['buildUrl'] = os.environ['BUILD_URL']
          path.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload validated site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Checkout fixed verification entry
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: lovemoganna/org-museum.el
          ref: 5c54566428bac03d4ea50796b179499247168e8d
          path: _publisher
          persist-credentials: false
      - name: Verify live published content
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 _publisher/tools/museum_pipeline.py verify --commit "$SOURCE_COMMIT"
