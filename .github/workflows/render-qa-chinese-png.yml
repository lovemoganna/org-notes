name: Render Chinese QA diagrams to PNG
on:
  push:
    paths:
      - ".github/workflows/render-qa-chinese-png.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Install SVG renderer and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-noto-cjk
      - name: Convert and verify nine teaching figures
        shell: bash
        run: |
          set -euo pipefail
          root="note-assets/613d704e-3781-4c14-9e2c-51f2309b6d91/qa-20261022"
          count=0
          for svg in "$root"/*.svg; do
            png="${svg%.svg}.png"
            rsvg-convert -w 1440 -h 860 -f png -o "$png" "$svg"
            python3 - "$png" <<'PY'
          from pathlib import Path
          import sys
          data = Path(sys.argv[1]).read_bytes()
          assert data[:8] == b"\x89PNG\r\n\x1a\n" and len(data) > 10000
          PY
            count=$((count + 1))
          done
          test "$count" -eq 9
          echo "Converted and verified $count Chinese teaching images"
      - name: Commit generated PNG assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add note-assets/613d704e-3781-4c14-9e2c-51f2309b6d91/qa-20261022/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Render nine QA-reviewed Chinese diagrams as PNG assets"
            git push origin HEAD:main
          fi
