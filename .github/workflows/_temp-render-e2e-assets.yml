name: TEMP render five QA illustrations (isolated branch only)
on:
  push:
    branches: [test/org-museum-e2e-content-five-20261012]
permissions:
  contents: write
jobs:
  render:
    if: "!contains(github.event.head_commit.message, 'qa: generated verified header assets')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: test/org-museum-e2e-content-five-20261012
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/_temp_render_e2e_headers.py
      - name: Store images only on isolated test branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add note-assets/
          git commit -m "qa: generated verified header assets"
          git push origin HEAD:test/org-museum-e2e-content-five-20261012
