name: Single principles source capture
on:
  push:
    branches: [review/note-reforge-principles-source-20261015]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify just this one original
        run: python3 tools/principles_capture.py
      - uses: actions/upload-artifact@v4
        with:
          name: one-article-principles-original
          path: _single_principles/
          retention-days: 7
