name: One-time Attach Five Content Images and Original Sources
on:
  push:
    branches: [review/note-reforge-five-content-20261013]
    paths: ['.github/workflows/one-time-attach-five.yml']
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: true}
      - name: Install Chinese fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --break-system-packages Pillow
      - run: python3 tools/one_time_attach_five.py
      - name: Commit assets and source-preserving note corrections (same isolated branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/knowledge/prompt-* notes/knowledge/stakeholder-* note-assets/
          git diff --cached --quiet && { echo 'No content change'; exit 1; }
          git commit -m "stage(content-e2e): preserve originals and attach five review graphics"
          git push origin HEAD:review/note-reforge-five-content-20261013
